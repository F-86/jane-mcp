[package]
name = "jane-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server", "transport-streamable-http-server-session", "macros", "schemars"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
chrono = "0.4"
schemars = "0.8"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
rss = "2.0"
urlencoding = "2.1"

[[bin]]
name = "jane-mcp"
path = "src/main.rs"
